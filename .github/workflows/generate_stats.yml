name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Jalankan setiap hari jam 00:00 UTC
  workflow_dispatch: # Bisa dijalankan manual juga

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: rilfikri15
          show_icons: true
          include_all_commits: true
          count_private: true
          theme: tokyo-night
          hide_border: true
          custom_title: "Beril's GitHub Stats"
          output: output/github-stats.svg

      - name: Generate Top Languages Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: rilfikri15
          layout: compact
          theme: tokyo-night
          hide_border: true
          output: output/top-langs.svg

      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: rilfikri15
          theme: onedark
          no-frame: true
          output: output/trophies.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Updated GitHub stats [skip ci]" || echo "No changes"
          git push

